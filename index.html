<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Generator</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1a1d23; --muted: #6b7280;
    --border: #e2e5ea; --accent: #0f766e; --accent-soft: #e6f4f2; --err: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  .card {
    max-width: 440px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 8px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button {
    padding: 12px; border: 1.5px solid var(--border); background: #fff; border-radius: 10px;
    font-size: 15px; cursor: pointer; color: var(--text);
  }
  .seg button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  input {
    width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px;
  }
  .preview { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .preview b { color: var(--text); font-family: ui-monospace, monospace; }
  .go {
    width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .go:disabled { opacity: .6; cursor: wait; }
  .result {
    display: none; margin-top: 20px; padding: 18px; border-radius: 12px;
    background: var(--accent-soft); text-align: center;
  }
  .result .id { font-family: ui-monospace, monospace; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
  .result button { margin-top: 10px; padding: 8px 16px; border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 8px; cursor: pointer; }
  .error { display: none; margin-top: 16px; color: var(--err); font-size: 14px; }
  h2 { font-size: 14px; margin: 28px 0 8px; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  li code { font-weight: 600; }
  li span { color: var(--muted); font-size: 12px; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <h1>ID Generator</h1>
  <p class="sub">Har ID unique hai aur Google Sheet mein save hoti hai.</p>

  <label>Gender</label>
  <div class="seg" id="gender">
    <button data-v="M" class="on">M — Male</button>
    <button data-v="F">F — Female</button>
  </div>

  <label>Type</label>
  <div class="seg" id="type">
    <button data-v="I" class="on">I — International</button>
    <button data-v="L">L — Local</button>
  </div>

  <label for="note">Name / Note (optional)</label>
  <input id="note" maxlength="200" placeholder="e.g. Ahmed Khan">

  <label for="pin">PIN</label>
  <input id="pin" type="password" inputmode="numeric" placeholder="Agar PIN set hai to likho">

  <div class="preview">Format: <b id="preview"></b></div>

  <button class="go" id="go">Generate ID</button>

  <div class="result" id="result">
    <div class="id" id="newId"></div>
    <button id="copy">Copy</button>
  </div>
  <div class="error" id="error"></div>

  <h2>Recent IDs</h2>
  <ul id="recent"><li><span>Loading…</span></li></ul>
</div>

<script>
  // Browser sirf apne Vercel API ko call karta hai. Google ka URL yahan nahi hai.
  const API = '/api/id';

  // PIN is browser mein yaad rahe taake har dafa na likhna pade
  try { $pinInit(); } catch (_) {}
  function $pinInit() {
    const saved = localStorage.getItem('id_pin');
    if (saved) document.getElementById('pin').value = saved;
  }

  const state = { gender: 'M', type: 'I' };
  const $ = (id) => document.getElementById(id);

  function mmyy() {
    const d = new Date();
    return String(d.getMonth() + 1).padStart(2, '0') + String(d.getFullYear()).slice(-2);
  }
  function updatePreview() {
    $('preview').textContent = `${state.gender}-${state.type}-${mmyy()}-###`;
  }

  ['gender', 'type'].forEach((group) => {
    $(group).addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      [...$(group).children].forEach((b) => b.classList.remove('on'));
      btn.classList.add('on');
      state[group] = btn.dataset.v;
      updatePreview();
    });
  });

  async function call(body) {
    const pin = $('pin').value.trim();
    try { localStorage.setItem('id_pin', pin); } catch (_) {}
    const opts = body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-pin': pin }, body: JSON.stringify(body) }
      : { method: 'GET', headers: { 'x-pin': pin } };
    const res = await fetch(API, opts);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Kuch masla hua');
    return data;
  }

  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    $('go').textContent = 'Generating…';
    $('error').style.display = 'none';
    try {
      const data = await call({ gender: state.gender, type: state.type, note: $('note').value.trim() });
      $('newId').textContent = data.id;
      $('result').style.display = 'block';
      $('note').value = '';
      loadRecent();
    } catch (err) {
      $('error').textContent = 'Error: ' + err.message;
      $('error').style.display = 'block';
    } finally {
      $('go').disabled = false;
      $('go').textContent = 'Generate ID';
    }
  });

  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('newId').textContent);
      $('copy').textContent = 'Copied ✓';
      setTimeout(() => ($('copy').textContent = 'Copy'), 1500);
    } catch (_) {}
  });

  async function loadRecent() {
    try {
      const data = await call(null);
      $('recent').innerHTML = data.rows.length
        ? data.rows.map((r) =>
            `<li><code>${r.id}</code><span>${r.note ? r.note + '<br>' : ''}${r.createdAt}</span></li>`
          ).join('')
        : '<li><span>Abhi koi ID nahi bani</span></li>';
    } catch (_) {
      $('recent').innerHTML = '<li><span>Recent list load nahi hui</span></li>';
    }
  }

  updatePreview();
  loadRecent();
</script>
</body>
</html>
